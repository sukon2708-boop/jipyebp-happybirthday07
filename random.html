<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>วงล้อตามใจ</title>

<!-- Font -->
<link href="https://fonts.googleapis.com/css2?family=Fahkwang:wght@500;700&display=swap" rel="stylesheet">

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:linear-gradient(180deg,#fde2e6,#f8bfc8);
  font-family:'Fahkwang',sans-serif;
  height:100vh;
  min-height:100svh;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  padding:16px;
}

/* WRAPPER */
#wrapper{
  width:280px;
  text-align:center;
}

/* TITLE */
h1{
  font-size:26px;
  font-weight:700;
  color:#fb6f92;
  margin-bottom:20px;
}

/* RESULT */
#result{
  margin-top:16px;
  font-size:20px;
  font-weight:700;
  color:#fff;
  background:linear-gradient(135deg,#fb6f92,#ff9db4);
  padding:12px 16px;
  border-radius:18px;
  display:none;
  box-shadow:0 10px 25px rgba(251,111,146,.45);
}

/* WHEEL */
#wheel{
  width:320px;
  height:320px;
  margin:0 auto;
  border-radius:50%;
  position:relative;
  overflow:hidden;
  border:10px solid #fff;
  box-shadow:0 25px 50px rgba(251,111,146,.45);
}

#wheel:before{
  content:'';
  position:absolute;
  inset:8px;
  border-radius:50%;
  border:3px solid rgba(255,255,255,.4);
  z-index:10;
  pointer-events:none;
}

/* INNER WHEEL */
#inner-wheel{
  width:100%;
  height:100%;
  position:relative;
  transition:transform 6s cubic-bezier(0,.99,.44,.99);
}

/* SECTIONS */
#wheel .sec{
  position:absolute;
  width:0;
  height:0;
  border-style:solid;
  border-width:165px 95px 0;
  transform-origin:95px 164px;
  left:60px;
  top:-5px;
}

/* COLORS */
.sec:nth-child(1){
  transform:rotate(60deg);
  border-color:#fb6f92 transparent;
}

.sec:nth-child(2){
  transform:rotate(120deg);
  border-color:#ff8fab transparent;
}

.sec:nth-child(3){
  transform:rotate(180deg);
  border-color:#f15f88 transparent;
}

.sec:nth-child(4){
  transform:rotate(240deg);
  border-color:#ffb3c6 transparent;
}

.sec:nth-child(5){
  transform:rotate(300deg);
  border-color:#ff9db4 transparent;
}

.sec:nth-child(6){
  transform:rotate(360deg);
  border-color:#e6527d transparent;
}

/* TEXT */
.sec span{
  position:relative;
  top:-120px;
  left:-45px;
  width:90px;
  display:block;
  font-size:16px;
  font-weight:700;
  color:#fff;
  text-align:center;
}

/* SPIN BUTTON */
#spin{
  width:70px;
  height:70px;
  border-radius:50%;
  background:#fff;
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  z-index:20;
  cursor:pointer;
  box-shadow:0 8px 20px rgba(251,111,146,.4);
}

#spin:after{
  content:"หมุน";
  line-height:70px;
  font-weight:700;
  color:#fb6f92;
  display:block;
}

#spin:before{
  content:"";
  position:absolute;
  top:-14px;
  left:15px;
  border-style:solid;
  border-width:0 20px 26px 20px;
  border-color:transparent transparent #fff transparent;
}

/* BUTTON */
.btn-group{
  margin-top:26px;
}

.back-btn{
  font-family:'Fahkwang',sans-serif;
  background:transparent;
  border:2px solid #fb6f92;
  color:#fb6f92;
  padding:12px 34px;
  border-radius:30px;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
}

.back-btn:hover{
  background:#fb6f92;
  color:#fff;
}

/* CONFETTI */
.confetti{
  position:fixed;
  top:-10px;
  width:10px;
  height:10px;
  background:hotpink;
  animation:fall 2.2s linear forwards;
  z-index:100;
}

@keyframes fall{
  to{
    transform:translateY(110vh) rotate(720deg);
    opacity:0;
  }
}

/* MOBILE */
html{
  overflow-x:hidden;
}

body > *{
  max-width:420px;
}

/* จอเล็ก */
@media (max-width:400px){

  #wheel{
    width:290px;
    height:290px;
  }

  #wheel .sec{
    border-width:150px 86px 0;
    transform-origin:86px 149px;
    left:54px;
  }

  .sec:nth-child(1){transform:rotate(60deg);}
  .sec:nth-child(2){transform:rotate(120deg);}
  .sec:nth-child(3){transform:rotate(180deg);}
  .sec:nth-child(4){transform:rotate(240deg);}
  .sec:nth-child(5){transform:rotate(300deg);}
  .sec:nth-child(6){transform:rotate(360deg);}

  .sec span{
    top:-110px;
    left:-42px;
    width:84px;
    font-size:14px;
  }
}

/* จอเตี้ย */
@media (max-height:680px){

  #wheel{
    transform:scale(.88);
    margin-top:-10px;
    margin-bottom:-10px;
  }

  .btn-group{
    margin-top:18px;
  }
}
</style>
</head>

<body>

<div id="wrapper">

  <h1>วงล้อตามใจ</h1>

  <div id="wheel">

    <div id="inner-wheel">

      <div class="sec">
        <span>เลี้ยงชาบู</span>
      </div>

      <div class="sec">
        <span>ทำอะไรก็ได้ที่อยากให้ทำ</span>
      </div>

      <div class="sec">
        <span>พาไปเที่ยว</span>
      </div>

      <div class="sec">
        <span>นวด</span>
      </div>

      <div class="sec">
        <span>หอมแก้ม 10 ที</span>
      </div>

      <div class="sec">
        <span>ตัง 500</span>
      </div>

    </div>

    <div id="spin"></div>

  </div>

  <div id="result"></div>

  <div class="btn-group">
    <button class="back-btn" onclick="history.back()">
      ย้อนกลับ
    </button>
  </div>

</div>


<script>

/* =========================
   รายการในวงล้อ
========================= */

const items = [
  "เลี้ยงชาบู",
  "ทำอะไรก็ได้ที่อยากให้ทำ",
  "พาไปเที่ยว",
  "นวด",
  "หอมแก้ม 10 ที",
  "ตัง 500"
];


/* =========================
   ตัวแปรควบคุมการหมุน
========================= */

let spinning = false;
let currentRotation = 0;


/* =========================
   กดปุ่มหมุน
========================= */

$('#spin').on('click', function(){

  // ป้องกันการกดซ้ำระหว่างหมุน
  if(spinning) return;

  spinning = true;

  // ซ่อนผลลัพธ์เดิม
  $('#result').hide();


  /*
    สุ่มหมายเลขช่อง
    0 = ชาบู
    1 = บิงซู
    2 = เสื้อ MC
    3 = เสื้อ Uniqlo
    4 = ไปเที่ยว
    5 = ตามใจเธอ
  */

  const index = Math.floor(
    Math.random() * items.length
  );


  /*
    แต่ละช่องมีขนาด 60 องศา
  */

  const sectionAngle = 360 / items.length;


  /*
    หาตำแหน่งกึ่งกลางของช่องที่สุ่มได้
  */

  const targetAngle =
    index * sectionAngle +
    sectionAngle / 2;


  /*
    หมุนเพิ่ม 5 รอบเต็ม
    แล้วหมุนกลับให้ช่องที่เลือก
    มาอยู่ตรงลูกศรด้านบน
  */

  const extraRounds = 5 * 360;

const pointerOffset = 330;

const finalRotation =
  currentRotation +
  extraRounds +
  (pointerOffset - targetAngle);
  /*
    สั่งหมุนวงล้อ
  */

  $('#inner-wheel').css(
    'transform',
    'rotate(' + finalRotation + 'deg)'
  );


  /*
    เก็บองศาปัจจุบัน
    เพื่อให้การหมุนครั้งต่อไปต่อเนื่อง
  */

  currentRotation = finalRotation;


  /*
    รอให้หมุนครบ 6 วินาที
  */

  setTimeout(function(){

    /*
      แสดงผลลัพธ์เดียวกับช่องที่ถูกสุ่ม
    */

    $('#result')
      .text("คุณได้: " + items[index])
      .fadeIn();


    // เอฟเฟกต์กระดาษโปรย
    firework();


    spinning = false;

  },6000);

});


/* =========================
   CONFETTI
========================= */

function firework(){

  for(let i = 0; i < 60; i++){

    const c = document.createElement('div');

    c.className = 'confetti';

    c.style.left =
      Math.random() * 100 + 'vw';

    c.style.background =
      `hsl(${Math.random()*360},80%,65%)`;

    c.style.animationDuration =
      (1.5 + Math.random()) + 's';

    document.body.appendChild(c);

    setTimeout(function(){
      c.remove();
    },2500);

  }

}

</script>

</body>
</html>
